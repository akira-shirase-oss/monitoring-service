[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/akira-shirase-oss/service-monitor"
# Nothing is published until the licence is confirmed.
publish = false

[workspace.dependencies]
# Internal crates.
monitor-domain = { path = "crates/monitor-domain" }
monitor-db = { path = "crates/monitor-db" }

# External crates: versions live here only (rust-mastery chapter 15). Minimal features;
# one async runtime (Tokio); rustls is the one TLS stack.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
hmac = "0.12.1"
http-body-util = "0.1.5"
# SMTP for the email alert channel — rustls + tokio only, matching the single-TLS-stack rule.
# `tokio1-rustls` + `webpki-roots` + `aws-lc-rs` gives the rustls connector and Mozilla
# roots with the workspace's existing provider; lettre's `rustls-tls` bundle would force
# `ring` on top and rustls refuses an ambiguous process provider.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.21"
# TIMES in the store: RFC 3339 text, so SQLite files stay readable by hand.
time = { version = "0.3.55", default-features = false, features = ["std", "serde", "formatting", "parsing"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "timeout", "catch-panic", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
